<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#3f5bd6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小欧" />
  <title>小欧 · 手机版</title>
  <link rel="stylesheet" href="/styles.css?v=20260816-boardv3" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9709;</text></svg>" />
</head>
<body>
  <div class="app layout-explore">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="14" r="6"></circle>
            <path d="M18 20 L10 40"></path>
            <path d="M30 20 L38 40"></path>
            <path d="M10 40 L38 40"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>小欧</h1>
          <button type="button" class="topic-chip" id="topicChip" aria-haspopup="listbox" aria-expanded="false" title="换主题">
            <span id="topicLine">陪你一起想数学</span>
            <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <button class="gear" id="gearBtn" aria-label="家长设置" title="家长设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section id="exploreStage" class="explore-stage solve-workspace">
      <div class="caption-bar" id="captionBar">
        <div class="workspace-head">
          <strong>小欧说</strong>
          <button type="button" id="historyOpenBtn" class="workspace-history-btn">对话</button>
        </div>
        <div class="caption-scroll">
          <p id="tutorCaption">点开始玩，把方块拖进格子</p>
        </div>
      </div>
      <div class="play-stage">
        <div id="boardModeBar" class="board-mode-bar">
          <span>数学画板</span>
          <div class="board-mode-actions">
            <button type="button" id="boardInteractBtn" class="is-active" aria-pressed="true">操作</button>
            <button type="button" id="boardDrawBtn" aria-pressed="false">画笔</button>
          </div>
        </div>
        <div id="startPlayWrap" class="start-play">
          <p class="start-kicker">点开始玩，小欧会先想一道题</p>
          <button type="button" id="startPlayBtn" class="start-play-btn">开始玩</button>
        </div>
        <div id="stageHost" class="stage-host"></div>
        <canvas id="doodleCanvas" class="doodle-canvas" aria-hidden="true"></canvas>
        <div id="doodleToolbar" class="doodle-toolbar hidden">
          <button type="button" class="doodle-color is-active" data-color="#2f4ab8" aria-label="蓝色"></button>
          <button type="button" class="doodle-color" data-color="#d94b4b" aria-label="红色"></button>
          <button type="button" class="doodle-color" data-color="#2f9d6a" aria-label="绿色"></button>
          <button type="button" class="doodle-color" data-color="#e09a2c" aria-label="橙色"></button>
          <button type="button" id="doodleEraserBtn" class="doodle-eraser">橡皮</button>
          <button type="button" id="doodleResetBtn" class="doodle-reset-btn">重置</button>
        </div>
        <div id="stageToast" class="stage-toast hidden">摆好了</div>
      </div>
      <div id="stageTools" class="stage-tools hidden">
        <span id="trayCount">还剩 9 块</span>
        <div class="stage-tool-btns">
          <button type="button" id="undoTileBtn">收回</button>
        </div>
      </div>
    </section>

    <div id="messages" class="messages" aria-live="polite"></div>

    <footer class="composer">
      <div class="chips">
        <button id="exploreBtn" class="chip chip-primary hidden">✨ 出个新题</button>
        <div id="quickActions" class="quick-actions"></div>
      </div>
      <div class="say-panel">
        <div class="child-dock">
          <button type="button" id="talkBtn" class="talk-btn hidden" aria-pressed="false">我想说</button>
          <button type="button" id="doodleSendBtn" class="board-send-btn hidden" disabled>发画板</button>
        </div>
        <div id="imgPreview" class="img-preview hidden">
          <img id="imgPreviewThumb" alt="待发送的题目照片" />
          <span class="img-hint">拍好了，点发送给小欧。</span>
          <button id="imgRemoveBtn" class="img-remove" aria-label="移除照片">×</button>
        </div>
        <div id="voiceDock" class="voice-dock">
          <button type="button" id="voiceTalkBtn" class="voice-talk-btn" aria-pressed="false">
            <span class="voice-orb" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                <path d="M5 10a7 7 0 0 0 14 0"></path>
                <path d="M12 17v5"></path>
              </svg>
            </span>
            <span class="voice-label">点一下，跟小欧说</span>
            <span class="voice-hint" id="voiceHint">说完再点一下，小欧帮你写成字</span>
          </button>
        </div>
        <div class="input-row" id="inputRow">
          <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
          <button id="plusBtn" class="icon-btn" aria-label="还可以这样" title="小提示、换一题或拍照">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <textarea id="input" rows="1" placeholder="想打字也可以写在这里…" enterkeyhint="send"></textarea>
          <button id="micBtn" class="icon-btn" aria-label="语音输入" title="点一下，跟小欧说">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 17v5"></path>
            </svg>
          </button>
          <button id="sendBtn" class="send-btn" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13"></path>
              <path d="M22 2 15 22 11 13 2 9 22 2z"></path>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <div class="sheet-mask" id="topicSheet">
    <div class="action-sheet topic-picker" role="dialog" aria-label="选择主题">
      <p class="sheet-kicker">今天想玩什么</p>
      <div id="topicList" class="topic-list"></div>
      <button type="button" class="sheet-cancel" id="topicCancel">取消</button>
    </div>
  </div>

  <div class="sheet-mask" id="attachSheet">
    <div class="action-sheet" role="dialog" aria-label="还可以这样">
      <p class="sheet-kicker">还可以这样</p>
      <button type="button" id="hintBtn">小提示</button>
      <button type="button" id="newQuestionBtn">换一题</button>
      <button type="button" id="attachBtn">拍给我</button>
      <button type="button" id="drawBtn">画给小欧看</button>
      <button type="button" class="sheet-cancel" id="attachCancel">取消</button>
    </div>
  </div>

  <div class="sheet-mask" id="historySheet">
    <div class="sheet history-sheet" role="dialog" aria-label="刚才的对话">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <h2>刚才的对话</h2>
          <p>画板还在上面，这里是最近说过的话。</p>
        </div>
        <button class="sheet-close" id="historyClose" aria-label="完成">完成</button>
      </div>
      <div id="historyMount" class="history-mount"></div>
    </div>
  </div>

  <div class="drawer" id="drawer">
    <div class="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <h2>家长设置</h2>
          <p>孩子平时只看到聊天。</p>
        </div>
        <button class="sheet-close" id="drawerClose" aria-label="完成">完成</button>
      </div>

      <label class="field">
        <span>孩子的名字</span>
        <input id="childName" type="text" placeholder="例如：朵朵" maxlength="12" />
      </label>
      <label class="field">
        <span>现在怎么玩</span>
        <select id="modeSelect">
          <option value="explore">一起探索（小欧出题）</option>
          <option value="bring">带题来问（拍照作业）</option>
        </select>
      </label>
      <label class="field">
        <span>今天想研究什么</span>
        <select id="topicSelect"></select>
      </label>
      <label class="field">
        <span>难度档位</span>
        <select id="levelSelect"></select>
      </label>
      <label class="field">
        <span>出题大脑</span>
        <select id="authorSelect">
          <option value="glm">GLM-5.3</option>
          <option value="deepseek">DeepSeek V4 Pro</option>
        </select>
      </label>
      <label class="field">
        <span>思考模式</span>
        <select id="thinkingSelect">
          <option value="off">关闭 · 回答更快</option>
          <option value="on">开启 · 深度推理（更慢）</option>
        </select>
      </label>
      <label class="field" id="showReasoningField">
        <span>展示思考过程</span>
        <select id="showReasoningSelect">
          <option value="off">关闭 · 只看最终回复</option>
          <option value="on">开启 · 灰色展示思考</option>
        </select>
      </label>

      <div class="axioms">
        <div class="axioms-head">
          <span>本主题的几条公理</span>
          <small>其余靠推导</small>
        </div>
        <ul id="axiomList"></ul>
      </div>

      <button id="resetBtn" class="ghost-btn">开启新的探究</button>
      <p id="modelTag" class="model-tag"></p>
    </div>
  </div>

  <div id="drawModal" class="draw-modal hidden">
    <div class="draw-sheet">
      <div class="draw-head">
        <span>画板</span>
        <div class="draw-tools">
          <button id="drawUndo" class="draw-tool">撤销</button>
          <button id="drawClear" class="draw-tool">清空</button>
        </div>
      </div>
      <canvas id="drawCanvas" class="draw-canvas"></canvas>
      <div class="draw-actions">
        <button id="drawCancel" class="ghost-btn">取消</button>
        <button id="drawSend" class="primary-btn">发给小欧</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.22/konva.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="/activity/state.js?v=20260816-boardv3"></script>
  <script src="/activity/snap-grid.js?v=20260816-boardv3"></script>
  <script src="/board/state.js?v=20260816-boardv3"></script>
  <script src="/board/layer-pile.js?v=20260816-boardv3"></script>
  <script src="/board/path-board.js?v=20260816-boardv3"></script>
  <script src="/board/geometry-compass.js?v=20260816-boardv3"></script>
  <script src="/app.js?v=20260816-boardv3"></script>
</body>
</html>
